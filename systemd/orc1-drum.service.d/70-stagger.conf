# Stagger the six module hosts' start (2026-09-24). Started together (every orc1
# or orc1-jackd restart, and at boot) they contend for the Pi's 4 cores while each
# activates its JACK client, and the graph xruns ~5x in half a second -- each xrun
# is a ~21 ms glitch in the skipback recording. Measured: any ONE host restarted
# alone = 0 xruns. The skipback recorder goes first on its own (it has no delay),
# then drum, sampler, poly, chip, mono, bbkit, 0.7 s apart. (Drum at 0 xrun'd
# against the recorder's own start, so it waits too.)
[Service]
ExecStartPre=/bin/sleep 0.7
