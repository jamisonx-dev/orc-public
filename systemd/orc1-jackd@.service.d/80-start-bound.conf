# 2026-10-23: once this card's server answers (or is standing in for the main
# server, see orc1_jackd_card_start.sh), start any enabled module bound to it that
# is down -- e.g. after it stepped aside for the main server and came back. Also
# holds the unit in "activating" until the server answers, so its hosts never
# start against a server that is still opening the card and fall back to main.
# '+' = as root (it calls systemctl). See orc1/orc1_jackd_start_bound.sh.
[Service]
ExecStartPost=+/home/pibox/orc/orc1/orc1_jackd_start_bound.sh %n
