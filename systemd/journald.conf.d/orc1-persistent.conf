# /etc/systemd/journald.conf.d/orc1-persistent.conf (2026-10-24)
# Keep the journal on disk across reboots, capped. Raspberry Pi OS ships
# /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf (Storage=volatile),
# so a reboot used to erase every log: on 2026-10-24 the Pi froze for about a
# minute, the hardware watchdog (systemd RuntimeWatchdogSec=1m) reset it, and
# nothing was left to say why. This file sorts after "40-rpi-..." and wins.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemKeepFree=2G
SystemMaxFileSize=25M
