[Unit]
After=orc1-jackd.service

[Service]
# Guard the FX-return loop (2026-07-14): only run alsa_out when jackd is NOT on
# the pisound. When jackd owns hw:pisound (no L12), the wrapper idles instead of
# crash-looping on "Device or resource busy". Empty ExecStart= clears the vendor
# ExecStart before setting ours.
Environment=JACK_NO_START_SERVER=1
ExecStart=
ExecStart=/home/pibox/orc/orc1/pisound_out_start.sh
