# 2026-09-23 -- SKIPBACK COMES FIRST (owner: "the skipback is the most important
# thing here. everything else can go jump in a lake if the skipback isn't
# functioning"). The recorder is the always-on safety net:
#  * OOMScoreAdjust=-1000: under real memory exhaustion the kernel kills anything
#    ELSE first -- never the recorder.
#  * Restart=always + no start limit: however it exits (incl. its deliberate
#    exit-for-a-fresh-process after losing jackd), systemd brings it back, and
#    never gives up after a burst of failures.
[Unit]
StartLimitIntervalSec=0

[Service]
OOMScoreAdjust=-1000
Restart=always
RestartSec=0.5
