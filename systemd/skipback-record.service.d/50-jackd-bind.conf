# 2026-09-23: follow the JACK server through restarts, like every audio host
# (their 50-jack-server.conf). Without BindsTo, a jackd restart -- the L-12
# hotplug rule, a web card switch -- left the recorder retrying forever with a
# stale shm mapping ("Cannot open shm segment") while systemd said "active":
# recording silently stopped. BindsTo makes systemd restart it with jackd; the
# rings are KEPT on restart (init_ring resumes the head), so no audio is lost.
[Unit]
After=orc1-jackd.service
BindsTo=orc1-jackd.service
