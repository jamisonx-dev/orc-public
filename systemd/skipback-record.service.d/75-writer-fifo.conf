# Every recorder thread at SCHED_FIFO 1 (2026-09-29, the ssh-xrun hunt).
#
# The JACK process callback is Python, so each period it must take the GIL.
# The writer / checkpoint / watchdog threads that also hold the GIL used to be
# plain SCHED_OTHER: any CPU load on the Pi (a numpy test run over ssh, a
# benchmark, apt) preempted a writer MID-PASS while it held the GIL, and the
# callback (FIFO 5) sat waiting for it. MEASURED with ftrace on the live
# recorder: idle = 3 cycles in 1411 blocked on our own threads (worst cycle
# 1.35 ms); 8 s of 4-core load = 66 blocked cycles, worst 6 ms, writers
# preempted 1263x. A long enough preemption = a missed 21 ms period = xrun.
# Kernel wake-up latency stayed <= 0.09 ms: it is the GIL, not the scheduler.
#
# FIFO 1 = above every ordinary process, below every JACK thread (libjack
# still raises the process thread to FIFO 5 itself). The kernel's RT
# throttle (950 ms / 1 s) still bounds a runaway thread.
# ⚠ Do NOT add CPUSchedulingResetOnFork=yes: SCHED_RESET_ON_FORK applies to
# new THREADS too, so the writers came up SCHED_OTHER again (tried, measured).
# The recorder spawns no child processes, so there is nothing to reset.
[Service]
CPUSchedulingPolicy=fifo
CPUSchedulingPriority=1
