# SKIPBACK COMES FIRST (2026-09-29). Reserve memory for the recorder so no
# other program's appetite (Mixxx's library scan measured ~1 GB) can push its
# pages -- or the RAM rings it writes (tmpfs pages are charged to the cgroup
# that faults them in, i.e. this one) -- out under pressure. A RAM writer pass
# took 2.6 s under memory pressure the day this was added.
# NEEDS the memory cgroup: cgroup_enable=memory in /boot/firmware/cmdline.txt
# (the Raspberry Pi kernel disables it by default; without it these lines are
# silently ignored -- check /sys/fs/cgroup/cgroup.controllers lists memory).
[Service]
# hard floor: never reclaimed
MemoryMin=256M
# best effort above that (a big set of RAM rings)
MemoryLow=1G
