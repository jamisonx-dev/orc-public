# 2026-10-23: after jackd answers (40-wait-ready runs first), start any enabled
# unit bound to it that is down -- skipback first among them. Without this a
# failed jackd start stranded skipback + the hosts until someone started them by
# hand. '+' = as root (it calls systemctl). See orc1/orc1_jackd_start_bound.sh.
[Service]
ExecStartPost=+/home/pibox/orc/orc1/orc1_jackd_start_bound.sh %n
