# Don't report orc1-jackd "started" until jackd answers (2026-09-24). See
# orc1/orc1_jackd_wait_ready.sh: without this every module host started twice
# per jackd restart (first try hit a server that was still priming the L-12).
# TimeoutStartSec covers the start script's own card wait (up to 90 s at boot)
# plus this 80 s ready-wait.
[Service]
ExecStartPost=/home/pibox/orc/orc1/orc1_jackd_wait_ready.sh
TimeoutStartSec=200
