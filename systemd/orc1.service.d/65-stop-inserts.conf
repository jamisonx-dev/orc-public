# Stop the brain's fx-insert processes IN ORDER before systemd signals the rest
# of the cgroup (2026-09-24). The inserts (orc1_fxmix mixers + jalv plugins) are
# the brain's children, so `systemctl stop/restart orc1` used to SIGTERM a mixer
# and its plugin at the same instant -> jackd logged 20-40 "Broken pipe /
# CheckRes / DeactivateClient write error" lines per restart (harmless, but the
# health check read them as DEAD). Plugins first, then mixers: 0 lines.
# The brain starts them again on start (reap_and_apply).
[Service]
ExecStop=/usr/bin/python3 /home/pibox/orc/orc1/orc1_fx_inserts.py stop
